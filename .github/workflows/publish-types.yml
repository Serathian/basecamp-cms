name: Publish Types Package

on:
  push:
    branches: [main]
    paths:
      - 'src/collections/**'
      - 'src/payload.config.ts'
      - 'packages/types/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install root dependencies
        run: npm ci

      - name: Generate types
        run: npx payload generate:types
        env:
          PAYLOAD_CONFIG_PATH: src/payload.config.export-types.ts
          PAYLOAD_SECRET: build-secret-not-used-at-runtime
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Install package dependencies
        working-directory: packages/types
        run: npm install

      - name: Set version from run number
        working-directory: packages/types
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version

      - name: Build
        working-directory: packages/types
        run: npm run build

      - name: Publish
        working-directory: packages/types
        run: npm publish --provenance --access public
